# Book Catalog Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: book-catalog
spec:
  replicas: 1
  selector:
    matchLabels:
      app: book-catalog
  template:
    metadata:
      labels:
        app: book-catalog
    spec:
      containers:
      - name: book-catalog
        image: $CONTAINER_REGISTRY.azurecr.io/book_catalog:$VERSION   
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8093
        env:
        - name: DATABASE_URL
          value: "postgresql://sit722_part5_kush_user:ADFiE1eXAzDwqMnqvhHxO75aakuHhVgi@dpg-crldhg8gph6c73e42j00-a.oregon-postgres.render.com/sit722_part5_kush"

---
# Book Catalog Service
apiVersion: v1
kind: Service
metadata:
  name: book-catalog
spec:
  selector:
    app: book-catalog
  type: LoadBalancer
  ports:
    - port: 8093
      targetPort: 8093

---
