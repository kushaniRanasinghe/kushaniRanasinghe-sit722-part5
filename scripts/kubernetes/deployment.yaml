        - name: DATABASE_URL
          value: "postgresql://sit722_part5_kush_user:ADFiE1eXAzDwqMnqvhHxO75aakuHhVgi@dpg-crldhg8gph6c73e42j00-a.oregon-postgres.render.com/sit722_part5_kush"

