name: Terraform Infrastructure Setup

on:
  workflow_dispatch:  # You can trigger this manually

jobs:
  terraform:
    name: Apply Terraform Configuration
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: 1.5.0

      - name: Terraform Init
        run: terraform init
        working-directory: ./terraform

      - name: Terraform Apply
        run: terraform apply -auto-approve
        working-directory: ./terraform

      # Output container registry username and password, etc.
      - name: Terraform Output
        run: terraform output -json > terraform_output.json
        working-directory: ./terraform

      - name: Show Output
        run: cat terraform_output.json  # Prints the values in the action logs for manual use
